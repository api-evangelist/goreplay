- version: v1.3.2
  date: '2021-08-19'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.2
  highlights: 'Fix promiscuous mode - if enabled no need to filter on host as we want to capture traffic
    not related to this host #994 - Fix `--input-raw-realip-header` - Fixed false positive network interface
    lookups Thanks @DimaGolomozy!'
- version: v1.3.1
  date: '2021-08-12'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.1
  highlights: 'Fix duplicated requests on Linux #989 - Improve packet capture, to make packet processing
    multithreaded 11d61dcb4d518f7ba33ae6f3817a279cee36398d'
- version: v1.3.0
  date: '2021-08-06'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0
  highlights: '# Highlights Added official Windows support Traffic capture engine fully re-constructed
    to be more scalable, efficient and bulletproof. You should see way lower packet loss, capture quality,
    and CPU/Memory usage. Deprecated own HTTP client in favour of native Go HTTP library Increased stability,
    and numerous bug fixes. # Features - Added way to capture traffic from multipe ports with single input '
- version: v1.3.0_RC11
  date: '2021-08-03'
  prerelease: true
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0_RC11
  highlights: 'Fix loopback interface issue on windows - Fix buffer index number for sticky tcp output
    connection @DimaGolomozy - Fix output file size limits @lins05 - Fixed usage of `--input-raw-bpf-filter`
    - Fix BPF filter when listen on all interfaces - Optimize packet capture thread to reduce context
    switching - Added new debugging endpoint when `--http-pprof` enabled: /debug/vars - Added `--input-file-dry-r'
- version: v1.3.0_RC6
  date: '2021-06-30'
  prerelease: true
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0_RC6
  highlights: Significantly improved CPU and Memory usage. - Added `af_packet` packet capture engine for
    Linux - Skip incomplete or malformed messages from output (can be enabled back by setting --input-raw-allow-incomplete)
- version: v1.3.0_RC5
  date: '2021-06-10'
  prerelease: true
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0_RC5
  highlights: 'Added a way to capture multiple ports using one input like this: `--input-raw :80,8080,3000`
    #935 - Fixed usage of "localhost" hostname when trying to limit scope of packet capture (e.g. `--input-raw
    localhost:80`), now it properly binds to loopback interface #943 - Fixed detection of windows network
    interfaces #943 - Fixed Makefile job to generate windows binaries - Fixed big memory allocation is'
- version: v1.3.0_RC4
  date: '2021-06-09'
  prerelease: true
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0_RC4
  highlights: '# Changes from previous RC - Big changes in capture engine to give more performance and
    stability #916 - Fixed a bug when GoRepay were including outgoing HTTP request initialized within
    the app, and having the same port #941 - Added (again) windows support #940 - Fix Output HTTP connection
    leak #927'
- version: v1.3.0_RC1
  date: '2021-01-15'
  prerelease: true
  url: https://github.com/probelabs/goreplay/releases/tag/v1.3.0_RC1
  highlights: null
- version: v1.2.0
  date: '2020-09-17'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.2.0
  highlights: 'Engine CPU consumption reduced by 60% - Implemented M''mapped AF_PACKET for Linux. To enable
    set `--input-raw-engine af_packet`. #807 - Added Kafka TLS configuration flag #800 - Fix wrong param
    value updated while `--http-set-param` #791 - The engine can now capture more requests with large
    payload #797 - Created TCP package #97 - Fixed minor bugs in HTTP proto parser'
- version: v1.1.0
  date: '2020-07-04'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.1.0
  highlights: 'Fix usage of multiple `--input-raw` plugins, e.g. `--input-raw :80 --input-raw :81 --input-raw
    :82` - Allow to set byte size limits in human friedly format: `--output-file-size-limit`, `--output-file-max-size-limit`,
    `--copy-buffer-size` and `--input-raw-buffer-size` can now parse inputs from differents bases and
    data units like: 10mb, 10kb, 100gb, 18t - Fix calculation of the output file size whe'
- version: v1.0.0
  date: '2019-03-30'
  prerelease: false
  url: https://github.com/probelabs/goreplay/releases/tag/v1.0.0
  highlights: '## Long awaited major release of GoReplay! - Added option to specify custom BPF filter
    (e.g. tcpdump syntax). Can be useful in case of non standard network interfaces like tunneling or
    SPAN port. Example: `--input-raw-bpf-filter ''dst port 80’` - Support for reading directly from pcap
    file, using `--input-raw-engine pcap_file --input-raw ./recording.pcap`_ - Added official Docker image
    `docker pull'
