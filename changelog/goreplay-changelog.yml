staleness: 'The last STABLE release is 1.3.3, published 2021-10-06, nearly five years before this pass.
  The last tag of any kind is the v2.0.0-rc2 prerelease of 2022-02-07. The master branch nonetheless reports
  itself as v2.0.0 and was pushed 2026-01-27, so development continues while distribution does not: a
  consumer installing via Homebrew, the Go proxy or the release tarballs gets 2021 code. The repository
  also changed hands in this window — github.com/buger/goreplay now redirects to github.com/probelabs/goreplay
  — without a release marking the move.'
