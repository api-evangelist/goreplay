description: GoReplay publishes no dated changelog page on goreplay.org — https://goreplay.org/changelog/
  returns 404 and the site sitemap lists no changelog URL. GitHub Releases is the provider's only dated,
  structured record of change, and the site links it directly from the homepage ("GitHub releases"). Entries
  below are transcribed verbatim-in-substance from that feed; URLs inside release bodies were stripped
  for brevity and the canonical release URL is carried per entry.
