aid: goreplay
name: GoReplay
description: GoReplay is an open source network traffic capture and replay tool, distributed as a single
  `gor` binary under LGPL-3.0, that records live HTTP traffic on a server and replays it against another
  environment for shadow testing, load testing with real production traffic, and debugging. It sits off
  the critical path rather than acting as a proxy, captures via libpcap without application changes, and
  can filter, rewrite or hand each message to external middleware before replay. A commercial GoReplay
  PRO edition ($2,950/year) adds Amazon S3 capture storage, binary protocol support, keep-alive TCP session
  recognition and dedicated support. GoReplay publishes no HTTP API of its own; its machine-readable contract
  is the CLI flag surface plus a documented middleware STDIN/STDOUT wire protocol.
